services:
  chapkit-simple-multistep-model:
    build:
      context: .
      # Bakes the commit into the image: GIT_REVISION=$(git rev-parse HEAD) docker compose up --build
      args:
        GIT_REVISION: ${GIT_REVISION:-}
    ports:
      - "8000:8000"
    volumes:
      - chapkit_data:/app/data

volumes:
  chapkit_data:
